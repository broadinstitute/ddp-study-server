        {
          "language": "en",
          "text": """<u>Learn more about your child's DNA:</u> The project is also partnering with Invitae and Genome Medical in order to sequence and share information with you about your child’s germline DNA (or DNA that is not from your child’s tumor) from saliva samples. After we’ve received your child’s saliva or blood as well as their tumor samples, you’ll be able to decide if you’d like your child to provide an additional saliva sample to learn more about your child’s non-tumor DNA by having germline genetic testing and speak with a genetic counselor to decide whether to have germline genetic testing to understand genetic testing results."""
        },
        {
          "language": "es",
          "text": """<u>Obtener más información sobre sus ADN:</u> El proyecto también se asoció con Invitae y Genome Medical para secuenciar y compartir información con usted sobre ADN de línea germinal (o ADN que no es de su tumor) de su hijo (a) a partir de sus muestras de saliva. Después de recibir la muestra de saliva o sangre de su hijo(a), así como también las muestras tumorales, usted podrá decidir si le gustaría que su hijo(a) brinde una muestra de saliva adicional para obtener más información sobre el ADN no tumoral de su hijo(a) mediante pruebas genéticas de línea germinal y hablar con un asesor genético y decidir si debe realizarse una prueba genética de línea germinal para comprender esos resultados."""
