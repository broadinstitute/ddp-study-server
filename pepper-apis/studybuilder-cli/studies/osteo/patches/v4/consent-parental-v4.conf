          "text": """If you choose to have genetic counseling and germline genetic testing, your child’s samples and limited health information will be made available to staff at Invitae and Genome Medical. If you choose not to participate in this aspect of the study, your child’s information and samples will not be shared with Invitae and Genome Medical."""
        },
        {
          "language": "es",
          "text": """Si elige recibir asesoramiento genético, sus muestras e información médica limitada se compartirán con personal de Invitae, y Genome Medical. Si elige no participar en este aspecto del estudio, la información y muestras de su hijo(a) no se compartirán con Invitae ni con Genome Medical."""
        },
