      "name": "v2_osteo_consent_minors_s1_participation_detail_p6",
      "translations": [
        {
          "language": "en",
          "text": """The project is also partnering with Genome Medical to provide genetic counseling and Invitae in order to sequence and share information on germline DNA (“normal” DNA that is not from your child’s tumor) from saliva samples. After we’ve received your child’s saliva or blood as well as their tumor samples, we’ll reach out to tell you more about this opportunity."""
        },
        {
          "language": "es",
          "text": """El proyecto también se asoció con  Genome Medical para brindar asesoramiento genético e Invitae secuenciar y compartir información sobre ADN de línea germinal (ADN "normal" que no es del tumor de su hijo(a)) a partir de muestras de saliva. Una vez que hayamos recibido la saliva o la sangre de su hijo(a), así como las muestras de su tumor, nos pondremos en contacto con usted para informarle sobre esta oportunidad."""
        },
      ]
    },
    {
      "name": "v2_osteo_consent_minors_s1_voluntary_content",
      "translations": [
        {
          "language": "en",
          "text": """
          If we are able to successfully sequence your child’s tumor sample(s), we can share what we’ve learned from tumor sequencing with you. When you consent to the study, you’ll be able to choose whether or not you'd like to hear about what we’re able to learn from your child’s tumor.
          </br></br>
          During the project, you may be able to decide if you’d like to learn more about your child’s germline DNA (or “normal” DNA) through a partnership with Genome Medical and Invitae by having germline genetic testing. The resulting information may include details that inform cancer risk for you and your family."""
        },
        {
          "language": "es",
          "text" : """
                Si podemos secuenciar correctamente las muestras tumorales de su hijo(a), podemos compartir con usted lo que hemos aprendido de la secuenciación del tumor. Cuando dé su consentimiento para participar en el estudio, podrá decidir si desea recibir información sobre lo que podemos aprender del tumor de su hijo(a).
                </br></br>
                Durante el proyecto, es posible que pueda decidir si desea obtener más información sobre el ADN de la línea germinal de su hijo(a) o  el ADN "normal") a través de una asociación con Genome Medical e Invitae para realizar pruebas genéticas de línea germinal. La información resultante puede incluir detalles que informen sobre el riesgo de cáncer para usted y su familia.
          """
        },
       ]
      },
    {
      "name": "v2_osteo_consent_minors_s1_benefits_detail_p2",
      "translations": [
        {
          "language": "en",
          "text": """Results from the sequencing of your child’s non-tumor (germline) DNA from Genome Medical and Invitae may include details that inform cancer risk for your child and your family. You will be offered genetic counseling to help ensure you understand the germline genetic results."""
        },
        {
          "language": "es",
          "text": """Los resultados de la secuenciación del ADN no tumoral (línea germinal) de su hijo(a) de Genome Medical e Invitae podrían incluir detalles que indiquen el riesgo de cáncer para su hijo(a) y su familia. Le ofrecerán asesoramiento genético para ayudar a garantizar que comprenda los resultados genéticos de la línea germinal."""
        }
      ]
    },
    {
      "name": "v2_osteo_consent_minors_s1_risks_detail_p3",
      "translations": [
        {
          "language": "en",
          "text": """If you choose to learn more about your child’s germline (“normal”) DNA, by having germline genetic testing, learning about genetic risk for cancer for yourself or relatives may cause worry or fear about the future. You may learn about cancer risks that are unclear, unrelated to your child’s current diagnosis or are unexpected based on your child’s personal or family history."""
        },
        {
          "language": "es",
          "text": """Si elige obtener más información sobre el ADN de línea germinal ("normal") de su hijo(a) mediante pruebas genéticas de línea germinal, obtener información sobre riesgos genéticos de cáncer para usted o sus familiares podría causarle preocupación o miedo sobre el futuro. Es posible que obtenga información sobre riesgos de cáncer que no es clara, no está relacionada con el diagnóstico actual de su hijo(a), o es inesperada según los antecedentes personales o familiares de su hijo(a)."""
        }
      ]  
    },
    {
      "name": "v2_osteo_consent_minors_s1_sharing_detail_p1",
      "translations": [
        {
          "language": "en",
          "text": """Your child’s samples and health information will be available to study staff and researchers at Count Me In, the Broad Institute of MIT and Harvard, Boston Children’s Hospital, Dana-Farber Cancer Institute, and the University of Chicago. After removing your child’s name and other readily identifiable information, we will share results obtained from your/your child’s participation with the greater research community via established public scientific databases."""
        },
        {
          "language": "es",
          "text": """Las muestras y la información de salud de su hijo(a) estarán disponibles para el personal del estudio y los investigadores de Count Me In, el Broad Institute del MIT y Harvard, el Boston Children's Hospital, el Dana-Farber Cancer Institute y la Universidad de Chicago. Luego de que eliminemos el nombre de su hijo(a) y cualquier otro tipo de información que pueda identificarlo(a), compartiremos los resultados obtenidos gracias a su participación con la comunidad de investigación a través de reconocidas bases de datos científicos de acceso público."""
        },
      ]  
    },
