      "translations": [
        {
          "language": "en",
          "text": """<u>Learn more about your DNA:</u> The project is also partnering with Invitae and Genome Medical in order to sequence and share information with you about your germline DNA (or DNA that is not from your tumor) from saliva samples. After we’ve received your saliva or blood as well as your tumor samples, you’ll be able to decide if you’d like to provide an additional saliva sample to learn more about your non-tumor DNA by having germline genetic testing and speak with a genetic counselor to decide whether to have germline genetic testing and to understand genetic testing results."""
        },
        {
          "language": "es",
          "text": """<u>Obtener más información sobre sus ADN:</u> El proyecto también se asoció con Invitae y Genome Medical para secuenciar y compartir información con usted sobre ADN de línea germinal (o ADN que no es de su tumor) a partir de sus muestras de saliva. Después de recibir su muestra de saliva o sangre, así como también las muestras tumorales, usted podrá decidir si le gustaría brindar una muestra de saliva adicional para obtener más información sobre su ADN no tumoral, al hacerse una prueba genética de línea germinal y hablar con un asesor genético para comprender esos resultados."""
        }
      ]  
    },
