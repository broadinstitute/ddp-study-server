    {
      "name": "v2_osteo_consent_s1_participation_detail_p6",
      "translations": [
        {
          "language": "en",
          "text": """The project is also partnering with Genome Medical to provide genetic counseling and Invitae in order to sequence and share information on germline DNA (“normal” DNA that is not from your tumor) from saliva samples. After we’ve received your saliva or blood as well as your tumor samples, we’ll reach out to tell you more about this opportunity."""
        },
        {
          "language": "es",
          "text": """El proyecto también se asoció con Genome Medical para brindar asesoramiento genético e Invitae para secuenciar y compartir información sobre ADN de línea germinal (ADN "normal" que no es de su tumor) a partir de muestras de saliva. Una vez que hayamos recibido su saliva o su sangre, así como las muestras de su tumor, nos pondremos en contacto con usted para informarle sobre esta oportunidad."""
        },
      ]
    },
    {
      "name": "v2_osteo_consent_s1_voluntary_content",
      "translations": [
        {
          "language": "en",
          "text": """If we are able to successfully sequence your tumor sample(s), we can share what we’ve learned from tumor sequencing with you. When you consent to the study, you’ll be able to choose whether or not you'd like to hear about what we’re able to learn from your tumor.
              </br>During the project, you may be able to decide if you’d like to learn more about your germline DNA (or “normal” DNA) through a partnership with Genome Medical and Invitae by having germline genetic testing.
              The resulting information may include details that inform cancer risk for you and your family."""
        },
        {
          "language": "es",
          "text" : """
                Si podemos secuenciar correctamente sus muestras tumorales, podemos compartir con usted lo que hemos aprendido de la secuenciación del tumor. Cuando usted da su consentimiento para participar en el estudio, podrá elegir si desea o no conocer lo que podamos aprender de su tumor.
                </br>Durante el proyecto, es posible que pueda decidir si desea obtener más información sobre su ADN de la línea germinal (o el ADN "normal") a través de una asociación con Genome Medical e Invitae para realizar pruebas genéticas de línea germinal. La información resultante puede incluir detalles que informen sobre el riesgo de cáncer para usted y su familia.
          """
        },
       ]
      },
    {
      "name": "v2_osteo_consent_s1_benefits_detail_p2",
      "translations": [
        {
          "language": "en",
          "text": """Results from the sequencing of your non-tumor (germline) DNA from Genome Medical and Invitae may include details that inform cancer risk for you and your family. You will be offered genetic counseling to help ensure you understand the germline genetic results."""
        },
        {
          "language": "es",
          "text": """Los resultados de la secuenciación de su ADN no tumoral (línea germinal) realizada por Genome Medical e Invitae podrían incluir detalles sobre riesgos de cáncer para usted y su familia. Le ofrecerán asesoramiento genético para ayudar a garantizar que comprenda los resultados genéticos de la línea germinal."""
        }
      ]
    },
    {
      "name": "v2_osteo_consent_s1_risks_detail_p1",
      "translations": [
        {
          "language": "en",
          "text": """If you choose to share blood samples, you may experience slight pain and swelling where the blood was drawn. If you choose to share tumor samples with us and learn more about what we found in sequencing, what the information means for your medical care may be unclear. If you choose to learn more about your germline (“normal”) DNA, by having germline genetic testing, learning about genetic risk for cancer for yourself or relatives may cause worry or fear about the future. You may learn about cancer risks that are unclear, unrelated to your current diagnosis, or are unexpected based on your personal or family history."""
        },
        {
          "language": "es",
          "text": """Si decide proporcionar muestras de sangre, puede sentir un leve dolor e hinchazón en el lugar de la extracción. Si elige compartir muestras tumorales con nosotros y obtener más información sobre lo que encontremos en la secuenciación, el significado de la información para su atención médica podría no ser claro. Si elige obtener más información sobre su ADN de línea germinal ("normal") al realizarse una prueba genética de línea germinal, obtener información sobre riesgos genéticos de cáncer para usted o sus familiares podría causarle preocupación o miedo sobre el futuro. Es posible que obtenga información sobre riesgos de cáncer que no es clara, no está relacionada con su diagnóstico actual, o es inesperada según sus antecedentes personales o familiares."""
        }
      ]  
    },
    {
      "name": "v2_osteo_consent_s1_sharing_detail_p1",
      "translations": [
        {
          "language": "en",
          "text": """Your samples and health information will be available to study staff and researchers at Count Me In, the Broad Institute of MIT and Harvard, Boston Children’s Hospital, Dana-Farber Cancer Institute, and the University of Chicago. After removing your name and other readily identifiable information, we will share results obtained from your participation with the greater research community via established public scientific databases."""
        },
        {
          "language": "es",
          "text": """Sus muestras e información médica estarán a disposición del equipo y los investigadores del estudio de Count Me In, del Broad Institute del MIT y Harvard, Boston Children's Hospital, Dana-Farber Cancer Institute y La Universidad de Chicago. Luego de que eliminemos su nombre y cualquier otro tipo de información que pueda identificarlo(a), compartiremos los resultados obtenidos gracias a su participación con la comunidad de investigación a través de reconocidas bases de datos científicos de acceso público."""
        }
      ]  
    },
    {
      "name": "v2_osteo_consent_s1_sharing_detail_p2",
      "translations": [
        {
          "language": "en",
          "text": """If you choose to have genetic counseling and germline genetic testing, your samples and limited health information will be made available to staff at Invitae, and Genome Medical. If you choose not to participate in this aspect of the study, your information and samples will not be shared with Invitae and Genome Medical."""
        },
        {
          "language": "es",
          "text": """Si elige recibir asesoramiento genético y pruebas genéticas de line germinal, sus muestras e información médica limitada se compartirán con personal de Invitae, y Genome Medical. Si elige no participar en este aspecto del estudio, su información y muestras no se compartirán con Invitae ni con Genome Medical."""
        },
      ]  
    },
    {
