      "name": "osteo_germline_consent_addendum_pediatric_intro1",
      "translations": [
        {
          "language": "en",
          "text": "This consent addendum gives new information about the research study in which you agreed to have your child participate in and will ask you to decide whether you would like your child to provide an additional saliva sample to learn about their non-tumor (also called “normal” or germline DNA) by having genetic counseling and germline genetic testing. The information from testing may include details that inform cancer risk for you and your family. The procedures noted below are in addition to those which you were informed about in the previous consent form. If you decide to participate in this part of the study, please sign and date and the end of this form. You will receive a copy of this form to the email address that you used to register for the project so that you can refer to it while you are involved in this research study."
        },
        {
          "language": "es",
          "text": """Este anexo al consentimiento proporciona información nueva sobre el estudio de investigación en el que usted aceptó dejar participar a su hijo(a) y le pedirá que decida si desea que su hijo(a) proporcione una muestra de saliva adicional para obtener información sobre su ADN no tumoral (también denominado ADN "normal" o de línea germinal) Mediante asesoramiento genético y pruebas genéticas de línea germinal. La información de las pruebas puede incluir detalles que indiquen el riesgo de cáncer para usted y su familia. Los procedimientos mencionados a continuación son complementarios de aquellos que se le informaron en el formulario de consentimiento anterior. Si decide participar en esta parte del estudio, firme y ponga la fecha al final de este formulario. Recibirá una copia de este formulario en la dirección de correo electrónico que utilizó para registrarse en el proyecto, para que pueda consultarla mientras participa en el presente estudio de investigación."""
        },
      ]
    },
    {
      "name": "osteo_germline_consent_addendum_pediatric_intro3",
      "translations": [
        {
          "language": "en",
          "text": "Results from the sequencing of your child’s non-tumor DNA will be shared with you during a phone appointment with a genetic counselor from Genome Medical."
        },
        {
          "language": "es",
          "text" : """Los resultados de la secuenciación del ADN no tumoral de su hijo(a) se compartirán con usted durante una cita telefónica con un asesor genético de Genome Medical."""
        },
      ]
    },
    {
      "name": "new_procedures_involved1_pediatric",
      "translations": [
        {
          "language": "en",
          "text": "Because your child has been diagnosed with [osteosarcoma or leiomyosarcoma], we are asking if you would like your child to contribute an additional saliva sample and learn more about your child’s non-tumor (“normal” or germline) DNA by having genetic counseling and germline genetic testing. The information shared with you would be on a small number of genes associated with hereditary cancers."
        },
        {
          "language": "es",
          "text": """Dado que a su hijo(a) le han diagnosticado un osteosarcoma, le preguntamos si desea que su hijo(a) aporte una muestra de saliva adicional y obtener más información sobre su ADN no tumoral ("normal" o de la línea germinal) mediante asesoramiento genético y pruebas genéticas de línea germinal. La información que compartiremos con usted estaría relacionada con una pequeña cantidad de genes asociados con los cánceres hereditarios."""
        }
      ]
    },
    {
      "name": "new_procedures_involved2_pediatric",
      "translations": [
        {
          "language": "en",
          "text": "If you elect to participate, your name, your child’s name, address, and contact information will be shared with Genome Medical and Invitae to conduct this process. You will schedule and have a phone appointment with a genetic counselor from Genome Medical. During the genetic counseling visit you will be asked about your medical history and the history of cancer in you and your family. You will be provided with additional information about germline genetic testing and you will be given an opportunity to decide whether to proceed with testing. If you decide to proceed with testing, then an additional saliva collection kit will be sent to you to have your child provide a sample for Invitae. When the results are available, you will have a second phone appointment with a genetic counselor from Genome Medical to discuss the results and any questions you may have."
        },
        {
          "language": "es",
          "text": """Si decide participar, se compartirá el nombre, dirección e información de contacto de su hijo(a) con Genome Medical e Invitae para llevar a cabo este proceso. Programará y tendrá una cita telefónica con un asesor genético de Genome Medical. Durante la consulta de asesoría genética, se le preguntará sobre su historial médico y los antecedentes de cáncer en usted y su familia. Se le proporcionará información adicional sobre las pruebas genéticas de línea germinal y se le dará la oportunidad de decidir si desea realizarlas. Si desea proceder se le enviará un kit de recolección de saliva adicional para entregue una muestra a Invitae. Cuando los resultados estén disponibles, tendrá una segunda cita telefónica  con un asesor genético de Genome Medical para analizar los resultados y cualquier pregunta que pueda tener."""
        }
      ]
    },
    {
      "name": "part_risks_p2_pediatric",
      "translations": [
        {
          "language": "en",
          "text": "There is a risk that your child’s information, including results of the “normal” DNA sequencing, could be seen by people who do not have permission. However, we have procedures and security measures in place designed to minimize this risk and protect the confidentiality of your information. It is possible for Genome Medical and Invitae to use your child’s health information for their internal purposes and for them to share your de-identified health information with third parties. Genome Medical and Invitae may receive payments from third parties for your child’s de-identified medical information. If you choose not to participate in this aspect of the study, your child’s information and samples will not be shared with Genome Medical or Invitae. You will learn more about how Genome Medical and Invitae are able to use your child’s health information during the consent process with Genome Medical."
        },
        {
          "language": "es",
          "text": """Existe el riesgo de que personas sin permiso puedan ver la información de su hijo(a), incluidos los resultados de la secuenciación del ADN "normal". Sin embargo, contamos con procedimientos y medidas de seguridad diseñados para reducir al mínimo este riesgo y proteger su información confidencial. Genome Medical e Invitae pueden utilizar la información médica de su hijo/a para fines internos y compartirla con terceros. Genome Medical e Invitae podrían recibir pagos de terceros por la información médica de su hijo/a. Si decide no participar en este aspecto del estudio, la información y las muestras de su hijo/a no se compartirán con Genome Medical ni con Invitae. Obtendrá más información sobre cómo Genome Medical e Invitae pueden utilizar la información médica de su hijo/a durante el proceso de consentimiento con Genome Medical."""
        }
      ]
    },
