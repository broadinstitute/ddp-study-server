  "activityCode": "GERMLINE_CONSENT_ADDENDUM",
  "translation-updates": [

    {
      "varName": "lms_germline_consent_addendum_intro1",
      "newValue": "This consent addendum gives new information about the research study in which you agreed to participate and will ask you to decide whether you would like to provide an additional saliva sample to learn about your non-tumor (also called “normal” or germline DNA) by having genetic counseling and germline genetic testing. The information from testing may include details that inform cancer risk for you and your family. The procedures noted below are in addition to those which you were informed about in the previous consent form. If you decide to participate in this part of the study, please sign and date at the end of this form. You will receive a copy of this form to the email address that you used to register for the project so that you can refer to it while you are involved in this research study."
    }
    {
      "varName": "lms_germline_consent_addendum_intro3",
      "newValue": "Results from the sequencing of your non-tumor DNA will be shared with you during a phone appointment with a genetic counselor from Genome Medical."
    },
    {
      "varName": "new_procedures_involved1",
      "newValue": "Because you have been diagnosed with leiomyosarcoma, we are asking if you would like to contribute an additional saliva sample and learn more about your non-tumor (“normal” or germline) DNA by having genetic counseling and germline genetic testing. The information shared with you would be on a small number of genes associated with hereditary cancers."
    },
    {
      "varName": "new_procedures_involved2",
      "newValue": "If you elect to participate, your name, address, and contact information will be shared with Genome Medical and Invitae to conduct this process. You will schedule and have a phone appointment with a genetic counselor from Genome Medical. During the genetic counseling visit you will be asked about your medical history and the history of cancer in you and your family. You will be provided with additional information about germline genetic testing and you will be given an opportunity to decide whether to proceed with testing. If you decide to proceed with testing, then an additional saliva collection kit will be sent to you to provide a sample to Invitae. When the results are available, you will have a second phone appointment with a genetic counselor from Genome Medical to discuss the results and any questions you may have."
    },
    {
      "varName": "part_risks_p2",
      "newValue": "There is a risk that your information, including results of the “normal” DNA sequencing, could be seen by people who do not have permission. However, we have procedures and security measures in place designed to minimize this risk and protect the confidentiality of your information. It is possible for Genome Medical and Invitae to use your health information for their internal purposes and for them to share your de-identified health information with third parties. Genome Medical and Invitae may receive payments from third parties for your de-identified medical information. If you choose not to participate in this aspect of the study, your information and samples will not be shared with Genome Medical or Invitae. You will learn more about how Genome Medical and Invitae are able to use your health information during the consent process with Genome Medical."
    },
    {
      "varName": "prompt_ADDENDUM_CONSENT_BOOL",
      "newValue": "You can share my information with Genome Medical and Invitae in order to conduct panel testing of my non-tumor/”normal” DNA."
    },
    {
      "varName": "somatic_consent_addendum_election_agree_pediatric",
      "newValue": """In addition, I agree to the following:<br>Genome Medical and Invitae can share the results of my panel test with the Leiomyosarcoma Project study staff.<br>"""
    }
  ]
