      "newValue": """The project is also partnering with Genome Medical to provide genetic counseling and Invitae in order to sequence and share information on germline DNA (“normal” DNA that is not from your tumor) from saliva samples. After we’ve received your saliva or blood as well as your tumor samples, we’ll reach out to tell you more about this opportunity."""
