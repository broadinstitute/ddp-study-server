      "varName": "lms_consent_s1_benefits_detail3",
      "newValue": """Results from the sequencing of your non-tumor (germline) DNA from Genome Medical and Invitae may include details that inform cancer risk for you and your family. You will be offered genetic counseling to help ensure you understand the germline genetic results."""
    },
    {
      "varName": "lms_consent_s1_risks_detail_p1",
      "newValue": """If you choose to share blood samples, you may experience slight pain and swelling where the blood was drawn. If you choose to share tumor samples with us and learn more about what we found in sequencing, what the information means for your medical care may be unclear. If you choose to learn more about your germline (“normal”) DNA, by having germline genetic testing, learning about genetic risk for cancer for yourself or relatives may cause worry or fear about the future. You may learn about cancer risks that are unclear, unrelated to your current diagnosis, or are unexpected based on your personal or family history."""
    },
    {
      "varName": "lms_consent_s1_sharing_detail1",
      "newValue": """Your samples and health information will be available to study staff and researchers at Count Me In, the Broad Institute of MIT and Harvard, Boston Children’s Hospital, Dana-Farber Cancer Institute, and the University of Chicago. After removing your name and other readily identifiable information, we will share results obtained from your participation with the greater research community via established public scientific databases."""
    },
    {
      "varName": "lms_consent_s1_sharing_detail2",
      "newValue": """If you choose to have genetic counseling and germline genetic testing, your samples and limited health information will be made available to staff at Invitae, and Genome Medical. If you choose not to participate in this aspect of the study, your information and samples will not be shared with Invitae and Genome Medical."""
    },
    {
      "varName": "lms_consent_s2_involvement_detail_p9",
      "newValue": """<u>Learn more about your DNA:</u> The project is also partnering with Invitae and Genome Medical in order to sequence and share information with you about your germline DNA (or DNA that is not from your tumor) from saliva samples. After we’ve received your saliva or blood as well as your tumor samples, you’ll be able to decide if you’d like to provide an additional saliva sample to learn more about your non-tumor DNA by having germline genetic testing and speak with a genetic counselor to decide whether to have germline genetic testing and to understand genetic testing results."""
