      "varName": "lms_germline_consent_addendum_pediatric_intro1",
      "newValue": "This consent addendum gives new information about the research study in which you agreed to have your child participate in and will ask you to decide whether you would like your child to provide an additional saliva sample to learn about their non-tumor (also called “normal” or germline DNA) by having genetic counseling and germline genetic testing. The information from testing may include details that inform cancer risk for you and your family. The procedures noted below are in addition to those which you were informed about in the previous consent form. If you decide to participate in this part of the study, please sign and date at the end of this form. You will receive a copy of this form to the email address that you used to register for the project so that you can refer to it while you are involved in this research study."
    }
    {
      "varName": "lms_germline_consent_addendum_pediatric_intro3",
      "newValue": "Results from the sequencing of your child’s non-tumor DNA will be shared with you during a phone appointment with a genetic counselor from Genome Medical."
    },
    {
      "varName": "new_procedures_involved1_pediatric",
      "newValue": "Because your child has been diagnosed with [osteosarcoma or leiomyosarcoma], we are asking if you would like your child to contribute an additional saliva sample and learn more about your child’s non-tumor (“normal” or germline) DNA by having genetic counseling and germline genetic testing. The information shared with you would be on a small number of genes associated with hereditary cancers."
    },
    {
      "varName": "new_procedures_involved2_pediatric",
      "newValue": "If you elect to participate, your name, your child’s name, address, and contact information will be shared with Genome Medical and Invitae to conduct this process. You will schedule and have a phone appointment with a genetic counselor from Genome Medical. During the genetic counseling visit you will be asked about your medical history and the history of cancer in you and your family. You will be provided with additional information about germline genetic testing and you will be given an opportunity to decide whether to proceed with testing. If you decide to proceed with testing, then an additional saliva collection kit will be sent to you to have your child provide a sample for Invitae. When the results are available, you will have a second phone appointment with a genetic counselor from Genome Medical to discuss the results and any questions you may have."
    },
    {
      "varName": "part_risks_p2_pediatric",
      "newValue": "There is a risk that your child’s information, including results of the “normal” DNA sequencing, could be seen by people who do not have permission. However, we have procedures and security measures in place designed to minimize this risk and protect the confidentiality of your information. It is possible for Genome Medical and Invitae to use your child’s health information for their internal purposes and for them to share your de-identified health information with third parties. Genome Medical and Invitae may receive payments from third parties for your child’s de-identified medical information. If you choose not to participate in this aspect of the study, your child’s information and samples will not be shared with Genome Medical or Invitae. You will learn more about how Genome Medical and Invitae are able to use your child’s health information during the consent process with Genome Medical."
